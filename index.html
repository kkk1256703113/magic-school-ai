        {
          "@type": "Question",
          "name": "什么是Magic School AI？",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Magic School AI是一个基于AI技术的专业文档和数学公式可视化平台。它能够将复杂的文档、PDF文件和数学公式转换为清晰、交互式的可视化内容，让学习和理解变得更加简单高效。"
          }
        },
        {
          "@type": "Question",
          "name": "Magic School AI支持哪些文件类型？",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "我们支持多种文件类型，包括：PDF文档、Word文档（.doc, .docx）、Excel表格（.xls, .xlsx）、文本文件（.txt）、Markdown文件（.md）、CSV文件、HTML文件以及JSON文件等。"
          }
        },
        {
          "@type": "Question",
          "name": "新用户有免费试用吗？",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "是的！新注册用户首月可获得20次免费API调用次数。这足够您充分体验我们平台的强大功能，包括文档分析、PDF内容提取、数学公式可视化等所有核心功能。"
          }
        },
        {
          "@type": "Question",
          "name": "Magic School AI如何保护用户隐私？",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "我们非常重视用户隐私。所有上传的文档都经过加密传输和存储，仅用于为您提供可视化服务。我们不会与第三方共享您的数据，处理完成后的文件会定期自动清理。"
          }
        },
        {
          "@type": "Question",
          "name": "支持哪些语言？",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Magic School AI目前支持中文和英文两种语言界面。AI处理能力支持多种语言的文档内容，包括但不限于中文、英文、日文、韩文、法文、德文等主流语言。"
          }
        },
        {
          "@type": "Question",
          "name": "如何升级到专业版？",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "您可以在用户菜单中点击'订阅管理'，选择月度或年度订阅计划。专业版提供无限次API调用、优先处理队列、高级可视化功能等专属权益。年度订阅享有特别优惠。"
          }
        },
        {
          "@type": "Question",
          "name": "Magic School AI的AI模型有多强大？",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "我们集成了最先进的AI模型，包括Claude 4和GPT-5，能够深度理解文档内容，准确识别数学公式，并生成高质量的可视化内容。AI能够理解上下文，提供智能的内容分析和建议。"
          }
        },

          "name": "可以批量处理文档吗？",

          }
        }
